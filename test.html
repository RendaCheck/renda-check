<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>仁大出勤打卡</title>
  <!-- 載入 LINE 官方 LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 30px 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    .card {
      background: white;
      border-radius: 16px;
      padding: 28px 20px;
      max-width: 380px;
      margin: 0 auto;
      box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }
    h2 { margin-top: 0; color: #2c3e50; font-size: 22px; }
    #user-display { color: #666; font-size: 15px; margin-bottom: 24px; }
    .btn {
      background-color: #06c755;
      color: white;
      border: none;
      padding: 16px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 12px;
      cursor: pointer;
      width: 100%;
      box-shadow: 0 4px 10px rgba(6,199,85,0.3);
      transition: background-color 0.2s;
    }
    .btn:active { background-color: #05a847; }
    .status-msg {
      margin-top: 20px;
      padding: 14px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 15px;
      white-space: pre-line;
      display: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h2>🏫 仁大出勤打卡</h2>
    <p id="user-display">正在連線至 LINE...</p>
    
    <button id="scan-btn" class="btn" style="display:none;" onclick="triggerLineNativeScan()">📷 開啟 LINE 原生相機掃碼</button>
    <div id="result-box" class="status-msg"></div>
  </div>

  <script>
  // ⚙️ 請替換為你的設定
  const MY_LIFF_ID = "2011120539-ft0mm7Nm"; 
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbwgZNQBhBM6W2hjogTcAJZpY1MQgzFKGRjvW_CJD1wLnd4KH43F3E6Q99hTJL_2B2hbaA/exec"; 

    let currentUser = null;

    window.onload = function () {
      liff.init({ liffId: MY_LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
          } else {
            liff.getProfile().then(profile => {
              currentUser = profile;
              document.getElementById("user-display").innerText = "同學：" + profile.displayName;
              document.getElementById("scan-btn").style.display = "block";
            });
          }
        })
        .catch(err => {
          showStatus("❌ LIFF 初始化失敗：" + err, "#ffebee", "#c62828");
        });
    };

    // 🚀 調用 LINE 原生掃碼介面 (免每次跳瀏覽器相機權限)
    function triggerLineNativeScan() {
      if (!liff.scanCodeV2) {
        showStatus("⚠️ 當前環境不支援 LINE 原生掃描，請確認是在 LINE 內開啟。", "#ffebee", "#c62828");
        return;
      }

      showStatus("正在啟動 LINE 掃碼相機...", "#e3f2fd", "#1565c0");

      liff.scanCodeV2()
        .then(result => {
          if (result && result.value) {
            // 掃碼成功取得字串，送往 GAS 後台記錄
            sendCheckIn(result.value);
          } else {
            showStatus("已取消掃碼", "#f5f5f5", "#666");
          }
        })
        .catch(err => {
          console.error(err);
          showStatus("⚠️ 掃碼啟動失敗或已取消", "#ffebee", "#c62828");
        });
    }

    function sendCheckIn(qrData) {
      showStatus("⏳ 打卡記錄處理中，請稍候...", "#fff3e0", "#e65100");

      fetch(GAS_API_URL, {
        method: "POST",
        body: JSON.stringify({
          action: "checkin",
          userId: currentUser.userId,
          qrCodeData: qrData
        })
      })
      .then(res => res.json())
      .then(data => {
        if (data.status === "success") {
          showStatus(data.message, "#e8f5e9", "#2e7d32");
          // 成功後 2.5 秒自動關閉 LIFF 視窗
          setTimeout(() => { liff.closeWindow(); }, 2500);
        } else {
          showStatus(data.message, "#ffebee", "#c62828");
        }
      })
      .catch(err => {
        showStatus("❌ 連線異常，請稍後再試", "#ffebee", "#c62828");
      });
    }

    function showStatus(text, bgColor, textColor) {
      const box = document.getElementById("result-box");
      box.innerText = text;
      box.style.backgroundColor = bgColor;
      box.style.color = textColor;
      box.style.display = "block";
    }
  </script>
</body>
</html>
